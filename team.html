<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team | Aqua Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Tenor+Sans&display=swap" rel="stylesheet">
  <style>
    :root {
      --sand: #f4ece1;
      --warm-aqua: #00a896;
      --deep-teal: #024959;
      --gold-accent: #d4a373;
      --text-dark: #1a3c40;
      --white: #ffffff;
      --font-heading: 'Tenor Sans', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      background-color: var(--sand);
      color: var(--text-dark);
      font-family: var(--font-body);
      line-height: 1.6;
    }

    header {
      background-color: var(--deep-teal);
      width: 100%;
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .brand {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      letter-spacing: 3px;
      color: var(--white);
      text-decoration: none;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    nav a {
      text-decoration: none;
      color: var(--white);
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav a:hover {
      color: var(--gold-accent);
    }

    .btn-signup {
      background-color: var(--gold-accent);
      color: var(--deep-teal) !important;
      padding: 8px 20px;
      border-radius: 2px;
    }

    .hero-team {
      background-color: var(--deep-teal);
      color: var(--white);
      padding: 100px 8% 60px;
      text-align: center;
    }

    .hero-team h1 {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 5vw, 4rem);
      margin-bottom: 15px;
    }

    .hero-team p {
      font-weight: 300;
      opacity: 0.8;
      max-width: 600px;
      margin: 0 auto;
    }

    .search-container {
      padding: 40px 8% 20px;
      display: flex;
      justify-content: center;
    }

    #teamSearch {
      width: 100%;
      max-width: 500px;
      padding: 15px 25px;
      border: none;
      background: var(--white);
      border-radius: 50px;
      font-family: var(--font-body);
      outline: none;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    #teamSearch:focus {
      box-shadow: 0 10px 25px rgba(2, 73, 89, 0.15);
    }

    .team-section {
      padding: 60px 8% 120px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 60px 35px;
    }

    .team-card {
      position: relative;
      background: transparent;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .avatar-wrapper {
      position: relative;
      width: 100%;
      padding-top: 130%;
      background: #e0d7cc;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      transition: all 0.5s ease;
    }

    .avatar-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(1.1);
      transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .team-card:hover .avatar-wrapper {
      transform: translateY(-15px);
      box-shadow: 0 25px 50px rgba(2, 73, 89, 0.2);
    }

    .team-card:hover img {
      filter: grayscale(0%) contrast(1);
      transform: scale(1.08);
    }

    .team-info {
      position: absolute;
      bottom: -25px;
      left: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 12px;
      text-align: left;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      border-left: 5px solid var(--gold-accent);
      transition: 0.4s ease;
      z-index: 2;
    }

    .team-card:hover .team-info {
      background: var(--white);
      bottom: -15px;
    }

    .team-info h3 {
      font-family: var(--font-heading);
      font-size: 1.35rem;
      color: var(--deep-teal);
      margin-bottom: 2px;
    }

    .role-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--gold-accent);
      font-weight: 800;
      display: block;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(0, 168, 150, 0.12);
      color: #00674e;
      font-size: 0.75rem;
      letter-spacing: 0.8px;
      font-weight: 700;
      margin-top: 12px;
    }

    .status-badge.offline {
      background: rgba(36, 37, 38, 0.08);
      color: rgba(26, 60, 64, 0.7);
    }

    .social-overlay {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      opacity: 0;
      transform: translateX(20px);
      transition: 0.4s ease;
      z-index: 3;
    }

    .team-card:hover .social-overlay {
      opacity: 1;
      transform: translateX(0);
    }

    .social-overlay a {
      width: 40px;
      height: 40px;
      background: var(--white);
      color: var(--deep-teal);
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      text-decoration: none;
      font-size: 0.7rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .social-overlay a:hover {
      background: var(--gold-accent);
      color: var(--white);
      transform: scale(1.1);
    }

    footer {
      background-color: var(--sand);
      padding: 80px 5% 40px;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.05);
    }

    .footer-brand {
      font-family: var(--font-heading);
      font-size: 1.2rem;
      color: var(--deep-teal);
      margin-bottom: 10px;
      display: block;
    }

    footer p {
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      nav a:not(.btn-signup) { display: none; }
      .grid { gap: 50px 20px; }
      .team-info { padding: 15px; }
    }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AQUA ACADEMY</a>
  <nav>
    <a href="curriculum.html">Curriculum</a>
    <a href="team.html">Team</a>
    <a href="archives.html">Archives</a>
    <a href="https://discord.gg/M3P3ncHCCZ" class="btn-signup">Join Discord</a>
  </nav>
</header>

<main>
  <section class="hero-team">
    <h1>Our Team</h1>
    <p>Meet the visionary minds shaping the intellectual sanctuary of Aqua Academy.</p>
  </section>

  <div class="search-container">
    <input type="text" id="teamSearch" placeholder="Search team member name..." onkeyup="searchTeam()">
  </div>

  <section class="team-section">
    <div class="grid" id="teamGrid"></div>
  </section>
</main>

<footer>
  <span class="footer-brand">AQUA ACADEMY</span>
  <p>© 2026 BRIGHT CHANGE • ATLANTIS PROJECT</p>
</footer>

<script>
  const teamBots = [
    {
      id: 'andreas',
      name: 'Andreas',
      fullName: 'Andreas Takagawa',
      role: 'Anggota OSIS • Singer',
      botImage: 'assets/bots/andre.png',
      status: 'Aktif',
      online: true,
      avatar: 'asset/andre.png',
      description: 'Andreas sering tampil di acara musik sekolah dan membantu menghidupkan suasana OSIS.'
    },
    {
      id: 'aya',
      name: 'Ayame',
      fullName: 'Ayame Ubarashiki',
      role: 'Bendahara OSIS • Penyiapan Ruangan',
      botImage: 'assets/bots/aya.png',
      status: 'Aktif',
      online: true,
      avatar: 'asset/aya.png',
      description: 'Aya memastikan setiap ruang siap dipakai siswa, termasuk pengaturan otomatis ruangan dan acara.'
    },
    {
      id: 'haru',
      name: 'Haruka',
      fullName: 'Haruka Arte',
      role: 'Ketua OSIS • Moderator',
      botImage: 'assets/bots/haru.png',
      status: 'Aktif',
      online: true,
      avatar: 'asset/haru.png',
      description: 'Haruka memimpin aturan sekolah dan memastikan siswa tetap disiplin saat berinteraksi.'
    },
    {
      id: 'kazu',
      name: 'Kazuma',
      fullName: 'Kazuma Hideyoshi',
      role: 'Wakil Ketua OSIS • Pemantau Data',
      botImage: 'assets/bots/kazu.png',
      status: 'Aktif',
      online: true,
      avatar: 'asset/kazu.png',
      description: 'Kazuma mencatat jumlah siswa, member aktif, dan mempublikasikan ringkasan ke web secara rutin.'
    },
    {
      id: 'kuma',
      name: 'Kumachi',
      fullName: 'Amamiya Kumachi',
      role: 'Anggota OSIS • Asisten Belajar (AI)',
      botImage: 'assets/bots/kuma.png',
      status: 'Aktif',
      online: true,
      avatar: 'asset/kuma.png',
      description: 'Kumachi mendampingi siswa yang butuh bimbingan dan membantu memudahkan proses belajar.'
    },
    {
      id: 'miwa',
      name: 'Miwazaki',
      fullName: 'Miwazaki Hyora',
      role: 'Sekretaris OSIS • Welcomer',
      botImage: 'assets/bots/miwa.png',
      status: 'Aktif',
      online: true,
      avatar: 'asset/miwa.png',
      description: 'Miwa sambut siswa baru dengan ramah dan memastikan mereka merasa diterima di lingkungan OSIS.'
    }
  ];

  function buildTeamCard(bot) {
    const card = document.createElement('div');
    card.className = 'team-card';
    card.innerHTML = `
      <div class="avatar-wrapper">
        <img src="${bot.avatar}" alt="${bot.name}">
      </div>
      <div class="team-info">
        <span class="role-label">${bot.role}</span>
        <h3>${bot.name}</h3>
        <span class="status-badge ${bot.online ? '' : 'offline'}">${bot.status}</span>
        <p>${bot.description}</p>
      </div>
    `;
    return card;
  }

  function renderTeamGrid() {
    const grid = document.getElementById('teamGrid');
    if (!grid) return;
    grid.innerHTML = '';
    teamBots.forEach(bot => {
      grid.appendChild(buildTeamCard(bot));
    });
  }

  function searchTeam() {
    const input = document.getElementById('teamSearch');
    const filter = input.value.toLowerCase();
    const grid = document.getElementById('teamGrid');
    const cards = grid.getElementsByClassName('team-card');

    for (let i = 0; i < cards.length; i++) {
      const name = cards[i].getElementsByTagName('h3')[0];
      if (name) {
        const textValue = name.textContent || name.innerText;
        cards[i].style.display = textValue.toLowerCase().indexOf(filter) > -1 ? '' : 'none';
      }
    }
  }

  window.addEventListener('DOMContentLoaded', renderTeamGrid);
</script>

</body>
</html>
