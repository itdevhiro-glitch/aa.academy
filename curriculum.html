<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements | Aqua Academy</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Tenor+Sans&display=swap" rel="stylesheet">
  <style>
    :root {
      --sand: #f4ece1;
      --warm-aqua: #00a896;
      --deep-teal: #024959;
      --gold-accent: #d4a373;
      --text-dark: #1a3c40;
      --white: #ffffff;
      --font-heading: 'Tenor Sans', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: var(--sand); color: var(--text-dark); font-family: var(--font-body); line-height: 1.6; }

    /* Header */
    header {
      background-color: var(--deep-teal);
      padding: 25px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    .brand { font-family: var(--font-heading); font-size: 1.4rem; letter-spacing: 3px; color: var(--white); text-decoration: none; }
    nav { display: flex; align-items: center; gap: 25px; }
    nav a { text-decoration: none; color: var(--white); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }

    /* Hero */
    .hero {
      background-color: var(--deep-teal);
      color: var(--white);
      padding: 100px 8% 60px;
      text-align: center;
    }
    .hero h1 { font-family: var(--font-heading); font-size: 3rem; margin-bottom: 15px; }

    /* Announcement Grid */
    .container { padding: 60px 8%; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    .card {
      background: var(--white);
      border-bottom: 4px solid var(--gold-accent);
      transition: 0.3s;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    
    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background-color: #eee;
    }

    .card-content { padding: 25px; flex-grow: 1; }
    .card-content h3 { font-family: var(--font-heading); color: var(--deep-teal); margin-bottom: 10px; }
    .card-content p { font-size: 0.9rem; color: #555; margin-bottom: 20px; }

    .btn-card {
      text-decoration: none;
      color: var(--deep-teal);
      font-weight: bold;
      font-size: 0.75rem;
      text-transform: uppercase;
      border-bottom: 1px solid var(--deep-teal);
      width: fit-content;
    }

    footer { text-align: center; padding: 40px; opacity: 0.6; font-size: 0.8rem; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="brand">AQUA ACADEMY</a>
  <nav>
    <a href="announcements.html">Announcements</a>
    <a href="team.html">Team</a>
    <a href="admin.html" style="opacity: 0.5;">Admin</a>
  </nav>
</header>

<section class="hero">
  <h1>Announcements</h1>
  <p>Latest updates from the Atlantis Project</p>
</section>

<div class="container">
  <div class="grid" id="announcementGrid">
    </div>
</div>

<footer>© 2026 BRIGHT CHANGE • ATLANTIS PROJECT</footer>

<script>
  function displayAnnouncements() {
    const grid = document.getElementById('announcementGrid');
    const posts = JSON.parse(localStorage.getItem('aqua_posts')) || [];

    if (posts.length === 0) {
      grid.innerHTML = "<p>No announcements yet.</p>";
      return;
    }

    // Urutkan dari yang terbaru
    grid.innerHTML = posts.reverse().map(post => `
      <div class="card">
        <img src="asset/announcement/${post.image}" alt="News" class="card-img" onerror="this.src='https://via.placeholder.com/400x200?text=No+Image'">
        <div class="card-content">
          <h3>${post.title}</h3>
          <p>${post.content}</p>
          ${post.link ? `<a href="${post.link}" target="_blank" class="btn-card">Read More →</a>` : ''}
        </div>
      </div>
    `).join('');
  }

  window.onload = displayAnnouncements;
</script>

</body>
</html>
